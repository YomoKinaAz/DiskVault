# Build (self-contained) → selftest → MSI / MSIX. A tag "v*" also creates a draft GitHub Release.
# Code signing via SignPath Foundation will be added here once the project is accepted.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build, selftest, MSI
        shell: pwsh
        run: ./build.ps1 -Installer

      - name: MSIX (Microsoft Store package, unsigned)
        shell: pwsh
        run: ./installer/msix/make_msix.ps1

      - name: Zip portable build
        shell: pwsh
        run: |
          $ver = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          Compress-Archive -Path dist/* -DestinationPath "out/DiskVault-$ver-x64-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: DiskVault
          path: |
            out/*.msi
            out/*.msix
            out/*.zip

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" out/*.msi out/*.zip --draft --title "DiskVault $env:GITHUB_REF_NAME" --generate-notes
